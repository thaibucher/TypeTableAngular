<div class="type-grid" [style]="gridStyle()">
	@for (type of types; track type.id) {
		<button
			class="type-button"
			[class.is-selected]="isSelected(type)"
			[disabled]="isDisabled(type)"
			[attr.title]="getDisabledTooltip(type)"
			[style.background-color]="getButtonColor(type)"
			[attr.aria-pressed]="isSelected(type)"
			type="button"
			(click)="toggleType(type)"
		>
			<span class="type-label">{{ type.name.toUpperCase() }}</span>
		</button>
	}
</div>
